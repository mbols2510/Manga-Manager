# Manga Manager: download this file and .env.example, then
#   cp .env.example .env     # fill it in
#   docker compose up -d                       # needs your own PostgreSQL (DATABASE_URL in .env)
# Dashboard: http://<host>:8080
services:
  manga-manager:
    image: ghcr.io/mbols2510/manga-manager:latest
    container_name: manga-manager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: "002"
      TZ: ${TZ:-Europe/Brussels}
      DC_MANGA_ROOT: /manga                       # container path; MANGA_ROOT below is a host path
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./config:/config                         # config.yml (library mapping), cover frames
      - ./data:/data                             # thumbnail cache, logs, CBZ scratch space
      - ${SUWAYOMI_DOWNLOADS:-./suwayomi-downloads}:/suwayomi/downloads   # Suwayomi download folder
      - ${MANGA_ROOT:-./manga}:/manga            # Kavita library folders (Regular / Adult / Hentai)
