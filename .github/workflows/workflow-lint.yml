name: Workflow lint

# actionlint over every workflow (pinned release binary, SHA-256 verified by android/tools/fetch_pinned.py).
# actionlint also runs shellcheck on run: scripts when shellcheck is installed (it is on ubuntu-latest).
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - ".github/**"
      - "android/tools/fetch_pinned.py"
      - "android/tools/test_workflows.py"
  pull_request:
    paths:
      - ".github/**"
      - "android/tools/fetch_pinned.py"
      - "android/tools/test_workflows.py"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned actionlint
        run: |
          bin=$(python3 android/tools/fetch_pinned.py actionlint "$RUNNER_TEMP/pinned-tools")
          echo "ACTIONLINT=$bin" >> "$GITHUB_ENV"
      - name: actionlint
        run: |
          "$ACTIONLINT" -version
          shellcheck --version | head -n 2 || echo "shellcheck not installed: run: scripts are not shellchecked"
          "$ACTIONLINT" -color
      - name: Workflow security invariants (secrets only on the tag path, one write job, no expressions in run:)
        run: python3 -m unittest discover -s android/tools -p 'test_workflows.py' -v
