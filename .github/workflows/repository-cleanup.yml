name: Requested repository cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repository-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'mbols2510/Manga-Manager' && github.event.before == 'debecdffb562277c7af54a6e4ab3685d81702b29'
    runs-on: ubuntu-latest
    steps:
      - name: Remove Android downloads, then non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCHES: '{"dependabot/github_actions/actions-minor-and-patch-51f0692e82":"ae62e1ad4e064b0a7b66eb4de00610edba366080","dependabot/gradle/android/android-minor-and-patch-8fc00586f0":"13c69bcafb489ac8b9c3cac349dd1f17cc0bb202","docs/android-companion-spec":"4c7dca760526ef7ad923a2a000b40d35362adfc6","feature/android-companion":"26ed25dcf249b19b2739649aacfd87467b4c2fce"}'
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
          def api(path, method='GET'):
              req = urllib.request.Request(base + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req) as res:
                      body = res.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise
          release = api('/releases/tags/android-v0.1.0')
          if release:
              api('/releases/' + str(release['id']), 'DELETE')
              print('Removed Android release and APK downloads')
          api('/git/refs/tags/android-v0.1.0', 'DELETE')
          from urllib.parse import quote
          expected = json.loads(os.environ['EXPECTED_BRANCHES'])
          for branch, sha in expected.items():
              current = api('/branches/' + quote(branch, safe=''))
              if current and current['commit']['sha'] != sha:
                  raise RuntimeError('Branch changed; refusing deletion: ' + branch)
          for branch in expected:
              api('/git/refs/heads/' + quote(branch, safe=''), 'DELETE')
              print('Removed branch: ' + branch)
          remaining = api('/branches?per_page=100')
          assert [b['name'] for b in remaining] == ['main'], remaining
          print('Verified: only main remains')
          PY
