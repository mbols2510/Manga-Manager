name: Android

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      write_verification_metadata:
        description: "Regenerate android/gradle/verification-metadata.xml (uploaded as an artifact, build is then marked failed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Decide dependency verification mode
        # Write mode: bootstrap when the file is missing, or on explicit request.
        env:
          REQUESTED: ${{ inputs.write_verification_metadata == true }}
        run: |
          if [ "$REQUESTED" = "true" ] || [ ! -f gradle/verification-metadata.xml ]; then
            echo "WRITE_VERIFICATION=true" >> "$GITHUB_ENV"
          else
            echo "WRITE_VERIFICATION=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Show installed Android SDK platforms and build-tools
        run: ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Only main writes the cache; branches and PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, unit tests, lint, release hardening (dependency verification strict)
        if: env.WRITE_VERIFICATION != 'true'
        run: ./gradlew --no-daemon --stacktrace verifyReleaseHardening testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Build while writing dependency verification metadata
        if: env.WRITE_VERIFICATION == 'true'
        run: ./gradlew --no-daemon --continue --write-verification-metadata sha256 verifyReleaseHardening testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload generated verification metadata
        if: always() && env.WRITE_VERIFICATION == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error

      - name: Fail when dependency verification was not enforced
        if: env.WRITE_VERIFICATION == 'true'
        run: |
          echo "::error::verification-metadata.xml was (re)generated, so this run did not verify dependencies. Commit the artifact and re-run."
          exit 1

      - name: Show merged debug manifest permissions and exported components
        run: |
          m=$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -n 1)
          echo "merged manifest: $m"
          grep -nE 'uses-permission|android:exported="true"|android:permission=' "$m" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
