name: Android

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      write_verification_metadata:
        description: "Regenerate android/gradle/verification-metadata.xml (uploaded as an artifact, build is then marked failed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Decide dependency verification mode
        # Write mode: bootstrap when the file is missing, or on explicit request.
        env:
          REQUESTED: ${{ inputs.write_verification_metadata == true }}
        run: |
          if [ "$REQUESTED" = "true" ] || [ ! -f gradle/verification-metadata.xml ]; then
            echo "WRITE_VERIFICATION=true" >> "$GITHUB_ENV"
          else
            echo "WRITE_VERIFICATION=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Show installed Android SDK platforms and build-tools
        run: ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Open-source GitHub Actions cache only (no commercial caching component).
          cache-provider: basic
          # Only main writes the cache; branches and PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, unit tests, lint, release hardening, merged release manifest check (dependency verification strict)
        if: env.WRITE_VERIFICATION != 'true'
        run: ./gradlew --no-daemon --continue --stacktrace verifyReleaseHardening checkReleaseMergedManifest testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Build while writing dependency verification metadata
        if: env.WRITE_VERIFICATION == 'true'
        run: ./gradlew --no-daemon --continue --write-verification-metadata sha256 verifyReleaseHardening checkReleaseMergedManifest testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload generated verification metadata
        if: always() && env.WRITE_VERIFICATION == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-metadata
          path: android/gradle/verification-metadata.xml
          if-no-files-found: error

      - name: Print generated verification metadata (gzip + base64, for environments that cannot download artifacts)
        if: always() && env.WRITE_VERIFICATION == 'true'
        run: |
          sha256sum gradle/verification-metadata.xml
          echo "-----BEGIN VERIFICATION METADATA-----"
          gzip -9 -c gradle/verification-metadata.xml | base64 -w 120
          echo "-----END VERIFICATION METADATA-----"

      - name: Fail when dependency verification was not enforced
        if: env.WRITE_VERIFICATION == 'true'
        run: |
          echo "::error::verification-metadata.xml was (re)generated, so this run did not verify dependencies. Commit the artifact and re-run."
          exit 1

      - name: Unit test counts (JUnit XML)
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then echo "no JUnit XML found"; exit 0; fi
          for f in "${files[@]}"; do
            grep -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || true
          done
          cat "${files[@]}" | grep -o '<testsuite [^>]*' | sed -E 's/.* tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/\1 \2 \3 \4/' \
            | awk '{t+=$1; s+=$2; f+=$3; e+=$4} END {printf "TOTAL tests=%d skipped=%d failures=%d errors=%d\n", t, s, f, e}'
          echo "Failed test cases:"
          for f in "${files[@]}"; do
            grep -A1 '<testcase ' "$f" | grep -B1 -E '<(failure|error) ' | grep -o 'testcase name="[^"]*" classname="[^"]*"' || true
          done

      - name: Show merged debug manifest permissions and exported components
        run: |
          m=$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -n 1)
          echo "merged manifest: $m"
          grep -nE 'uses-permission|android:exported="true"|android:permission=' "$m" || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
