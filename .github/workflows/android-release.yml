name: Android release

# Three jobs, the same topology in both modes; the mode is decided by the triggering event only (there is no
# input that can switch it):
#
#  build    no secrets anywhere. Checks out the commit, runs tests, lint, hardening, the merged-manifest check,
#           assembleRelease, the APK checks on the UNSIGNED APK and the OSV scan, and uploads only the unsigned
#           APK, its R8 mapping and their checksums (artifact android-release-unsigned).
#  sign     a FRESH runner that never runs Gradle or anything the build job produced except the downloaded
#           artifact, whose checksums it verifies. Sparse checkout of android/tools only, pinned build-tools.
#           RELEASE: the only step that references secrets signs the APK with apksigner (tools/sign_apk.sh);
#           the signed APK is checked again and uploaded with its SHA-256 (artifact android-release).
#           DRY RUN: a signing rehearsal with a throwaway key generated in the job; nothing is uploaded.
#  publish  tag pushes only, contents: write, no checkout: downloads the signed artifact, re-verifies the
#           SHA-256 and creates the GitHub Release.
#
# RELEASE = a pushed tag android-vX.Y.Z (pushed deliberately by the maintainer). DRY RUN = workflow_dispatch, or a
# push to feature/** that touches this workflow or android/tools. pull_request is deliberately not a trigger.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (see README "Android app" > "Release signing").

on:
  push:
    tags: ["android-v*"]
    # Path filters do not apply to tag pushes; they only limit the branch dry runs.
    branches: ["feature/**"]
    paths:
      - ".github/workflows/android-release.yml"
      - "android/tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check without secrets (${{ startsWith(github.ref, 'refs/tags/android-v') && 'release' || 'dry run' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mode
        run: |
          if [ "$RELEASE" = "true" ]; then echo "Mode: RELEASE (signed, published)"; else echo "Mode: DRY RUN (unsigned, artifact only)"; fi

      - name: Release tag must be android-vX.Y.Z
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like android-vX.Y.Z"
            exit 1
          fi
          echo "EXPECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Self-test of the APK check and vulnerability scan scripts (fixtures, no SDK)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # Release builds never read or write a cache: every artifact is re-downloaded and verified.
          cache-disabled: true

      - name: Build release, unsigned (tests, lint, hardening, merged manifest; no secrets)
        run: ./gradlew --no-daemon --stacktrace verifyReleaseHardening checkReleaseMergedManifest testDebugUnitTest lintDebug assembleRelease

      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop

      - name: APK checks on the unsigned APK, OSV dependency vulnerability scan, SHA-256 (dry run)
        if: env.RELEASE != 'true'
        run: tools/release_checks.sh build/release-out

      - name: APK checks on the unsigned APK, OSV dependency vulnerability scan, SHA-256 (release)
        if: env.RELEASE == 'true'
        run: tools/release_checks.sh build/release-out --expect-version "$EXPECT_VERSION"

      - name: Upload the unsigned APK, its R8 mapping and their checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-unsigned
          path: |
            android/build/release-out/app-release-unsigned.apk
            android/build/release-out/app-release-unsigned.apk.sha256
            android/build/release-out/mapping.txt
            android/build/release-out/mapping.txt.sha256
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign on a fresh runner (${{ startsWith(github.ref, 'refs/tags/android-v') && 'release' || 'rehearsal with a throwaway key' }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Every security decision in this job reads the github context directly (TAG_EXPR below), never env.RELEASE:
    # a step could rewrite an env variable for later steps through $GITHUB_ENV, but not the github context.
    env:
      # Exact build-tools directory for apksigner, zipalign, aapt2 and dexdump (never "the highest installed").
      BUILD_TOOLS_VERSION: "37.0.0"
    steps:
      # Only the scripts of the same commit; no Gradle, no Java/Gradle setup, no caches in this job.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: android/tools

      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-release-unsigned
          path: unsigned

      - name: Verify the checksums of the downloaded build
        working-directory: unsigned
        run: sha256sum -c app-release-unsigned.apk.sha256 mapping.txt.sha256

      - name: Runner and pinned build-tools
        run: |
          echo "runner: $RUNNER_NAME ($ImageOS $ImageVersion)"
          echo "pinned build-tools: $BUILD_TOOLS_VERSION"
          ls "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"

      - name: Release tag must be android-vX.Y.Z
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like android-vX.Y.Z"
            exit 1
          fi
          echo "EXPECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Signing rehearsal with a throwaway key (dry run only; never uploaded)
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v'))"
        env:
          ANDROID_KEYSTORE_PASSWORD: rehearsal-only-not-a-secret
          ANDROID_KEY_PASSWORD: rehearsal-only-not-a-secret
          ANDROID_KEY_ALIAS: rehearsal
        run: |
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.keystore" -storetype PKCS12 -alias rehearsal \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Signing rehearsal, O=Not for release" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/rehearsal.keystore") \
            android/tools/sign_apk.sh unsigned/app-release-unsigned.apk signed/app-release.apk
          rm -f "$RUNNER_TEMP/rehearsal.keystore"

      - name: Sign the release APK with apksigner (the only step with secrets)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android/tools/sign_apk.sh unsigned/app-release-unsigned.apk signed/app-release.apk

      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/rehearsal.keystore"

      - name: APK checks on the signed APK (release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        run: python3 android/tools/apk_check.py --apk signed/app-release.apk --mapping unsigned/mapping.txt --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" --expect-signed --expect-version "$EXPECT_VERSION"

      - name: APK checks on the rehearsal-signed APK (dry run)
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v'))"
        run: python3 android/tools/apk_check.py --apk signed/app-release.apk --mapping unsigned/mapping.txt --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" --expect-signed

      - name: SHA-256 of the signed APK
        working-directory: signed
        run: sha256sum app-release.apk > app-release.apk.sha256 && cat app-release.apk.sha256

      - name: Upload the signed APK and its SHA-256 (release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release
          path: |
            signed/app-release.apk
            signed/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-release
          path: dist

      - name: Create the GitHub Release with the signed APK and its SHA-256
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          test -f app-release.apk && test -f app-release.apk.sha256
          sha256sum -c app-release.apk.sha256
          sha=$(cut -d' ' -f1 app-release.apk.sha256)
          {
            echo "Signed Android companion app ${TAG#android-v}."
            echo
            echo "SHA-256 of app-release.apk:"
            echo
            echo "    $sha"
            echo
            echo "Verify before installing: \`sha256sum -c app-release.apk.sha256\` (or compare the value above)."
            echo
            echo "Only install this signed APK. The debug APK from CI builds is debuggable and exports test"
            echo "activities: it must never be used with a real device token."
          } > notes.md
          # --latest=false: server releases (vX.Y.Z) stay the repository's "latest release".
          # Created with GITHUB_TOKEN, which by GitHub's rules does not start other workflows, so the release
          # event does not trigger docker-publish.yml (which also skips non-v* tags as a second guard).
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest=false \
            --title "Android app ${TAG#android-v}" --notes-file notes.md \
            app-release.apk app-release.apk.sha256
