name: Android release

# Two modes, decided by the triggering event only (there is no input that can switch modes):
#
#  * RELEASE: a pushed tag android-vX.Y.Z (pushed deliberately by the maintainer). The tagged commit is built,
#    signed with the repository secrets, checked, and attached with its SHA-256 to a GitHub Release. Only the
#    "publish" job has contents: write, and it runs no project code.
#  * DRY RUN: workflow_dispatch, or a push to feature/** that touches this workflow or android/tools. Builds the
#    UNSIGNED release APK, runs the same checks and uploads the APK and its SHA-256 as a workflow artifact.
#    No secrets are referenced by any step that runs in this mode and nothing is published.
#
# pull_request is deliberately not a trigger, so no fork or PR can reach the signing secrets.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (see README "Android app" > "Release signing").

on:
  push:
    tags: ["android-v*"]
    # Path filters do not apply to tag pushes; they only limit the branch dry runs.
    branches: ["feature/**"]
    paths:
      - ".github/workflows/android-release.yml"
      - "android/tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check (${{ startsWith(github.ref, 'refs/tags/android-v') && 'signed release' || 'dry run, unsigned' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mode
        run: |
          if [ "$RELEASE" = "true" ]; then echo "Mode: RELEASE (signed, published)"; else echo "Mode: DRY RUN (unsigned, artifact only)"; fi

      - name: Release tag must be android-vX.Y.Z
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like android-vX.Y.Z"
            exit 1
          fi
          echo "EXPECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Self-test of the APK check and vulnerability scan scripts (fixtures, no SDK)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Release builds never read or write a cache: every artifact is re-downloaded and verified.
          cache-disabled: true

      - name: Write the signing keystore to the runner temp directory
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::repository secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release (tests, lint, hardening, merged manifest)
        if: env.RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # No configuration cache: the signing passwords must not be stored in a cache entry.
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace verifyReleaseHardening checkReleaseMergedManifest testDebugUnitTest lintDebug assembleRelease

      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Build unsigned release (dry run; tests, lint, hardening, merged manifest)
        if: env.RELEASE != 'true'
        run: ./gradlew --no-daemon --stacktrace verifyReleaseHardening checkReleaseMergedManifest testDebugUnitTest lintDebug assembleRelease

      - name: Release APK checks, OSV dependency vulnerability scan, SHA-256 (signed release)
        if: env.RELEASE == 'true'
        run: tools/release_checks.sh build/release-out --expect-signed --expect-version "$EXPECT_VERSION"

      - name: Release APK checks, OSV dependency vulnerability scan, SHA-256 (dry run)
        if: env.RELEASE != 'true'
        run: tools/release_checks.sh build/release-out

      - name: Upload APK and SHA-256
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE == 'true' && 'android-release' || 'android-release-dry-run-unsigned' }}
          path: |
            android/build/release-out/*.apk
            android/build/release-out/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

  verify-artifact:
    # Runs in both modes, so the artifact hand-over used by "publish" is exercised by every dry run.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')) && 'android-release' || 'android-release-dry-run-unsigned' }}
          path: dist
      - name: Verify SHA-256 of the downloaded artifact
        working-directory: dist
        run: |
          ls -l
          sha256sum -c ./*.sha256

  publish:
    needs: [build, verify-artifact]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-release
          path: dist

      - name: Create the GitHub Release with the signed APK and its SHA-256
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          test -f app-release.apk && test -f app-release.apk.sha256
          sha256sum -c app-release.apk.sha256
          sha=$(cut -d' ' -f1 app-release.apk.sha256)
          {
            echo "Signed Android companion app ${TAG#android-v}."
            echo
            echo "SHA-256 of app-release.apk:"
            echo
            echo "    $sha"
            echo
            echo "Verify before installing: \`sha256sum -c app-release.apk.sha256\` (or compare the value above)."
            echo
            echo "Only install this signed APK. The debug APK from CI builds is debuggable and exports test"
            echo "activities: it must never be used with a real device token."
          } > notes.md
          # --latest=false: server releases (vX.Y.Z) stay the repository's "latest release".
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest=false \
            --title "Android app ${TAG#android-v}" --notes-file notes.md \
            app-release.apk app-release.apk.sha256
