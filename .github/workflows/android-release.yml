name: Android release

# Two modes, decided by the triggering event only (there is no input that can switch modes):
#
#  * RELEASE: a pushed tag android-vX.Y.Z (pushed deliberately by the maintainer). The tagged commit is built and
#    checked WITHOUT secrets, exactly like a dry run; only then one step signs the finished APK with apksigner
#    (tools/sign_apk.sh), the signed APK is checked again, and it is attached with its SHA-256 to a GitHub
#    Release. Gradle never runs with the secrets. Only the "publish" job has contents: write, and it runs no
#    project code.
#  * DRY RUN: workflow_dispatch, or a push to feature/** that touches this workflow or android/tools. Builds the
#    UNSIGNED release APK, runs the same checks and uploads the APK and its SHA-256 as a workflow artifact.
#    No secrets are referenced by any step that runs in this mode and nothing is published.
#
# pull_request is deliberately not a trigger, so no fork or PR can reach the signing secrets.
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (see README "Android app" > "Release signing").

on:
  push:
    tags: ["android-v*"]
    # Path filters do not apply to tag pushes; they only limit the branch dry runs.
    branches: ["feature/**"]
    paths:
      - ".github/workflows/android-release.yml"
      - "android/tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check (${{ startsWith(github.ref, 'refs/tags/android-v') && 'signed release' || 'dry run, unsigned' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v') }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mode
        run: |
          if [ "$RELEASE" = "true" ]; then echo "Mode: RELEASE (signed, published)"; else echo "Mode: DRY RUN (unsigned, artifact only)"; fi

      - name: Release tag must be android-vX.Y.Z
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like android-vX.Y.Z"
            exit 1
          fi
          echo "EXPECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Self-test of the APK check and vulnerability scan scripts (fixtures, no SDK)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          # Release builds never read or write a cache: every artifact is re-downloaded and verified.
          cache-disabled: true

      - name: Build release, unsigned (tests, lint, hardening, merged manifest; no secrets)
        # Both modes build exactly the same way, without any signing secret in the environment.
        run: ./gradlew --no-daemon --stacktrace verifyReleaseHardening checkReleaseMergedManifest testDebugUnitTest lintDebug assembleRelease

      - name: Stop Gradle daemons
        if: always()
        run: ./gradlew --stop

      - name: APK checks on the unsigned APK, OSV dependency vulnerability scan, SHA-256 (dry run)
        if: env.RELEASE != 'true'
        run: tools/release_checks.sh build/release-out

      - name: APK checks on the unsigned APK, OSV dependency vulnerability scan (release)
        if: env.RELEASE == 'true'
        run: tools/release_checks.sh build/release-out --expect-version "$EXPECT_VERSION"

      - name: Signing rehearsal with a throwaway key (dry run only; result is discarded)
        # Exercises tools/sign_apk.sh (apksigner, zipalign, verify) and the signed-APK checks without any secret.
        if: env.RELEASE != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: rehearsal-only-not-a-secret
          ANDROID_KEY_PASSWORD: rehearsal-only-not-a-secret
          ANDROID_KEY_ALIAS: rehearsal
        run: |
          umask 077
          keytool -genkeypair -keystore "$RUNNER_TEMP/rehearsal.keystore" -storetype PKCS12 -alias rehearsal \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Signing rehearsal, O=Not for release" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/rehearsal.keystore") \
            tools/sign_apk.sh build/release-out/app-release-unsigned.apk build/rehearsal/app-release.apk
          rm -f "$RUNNER_TEMP/rehearsal.keystore"
          tools/release_checks.sh build/rehearsal --apk build/rehearsal/app-release.apk --no-osv --expect-signed
          rm -rf build/rehearsal

      - name: Sign the release APK with apksigner (the only step with secrets)
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tools/sign_apk.sh build/release-out/app-release-unsigned.apk build/release-signed/app-release.apk

      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/rehearsal.keystore"

      - name: APK checks on the signed APK, SHA-256 (release)
        if: env.RELEASE == 'true'
        run: tools/release_checks.sh build/release-signed --apk build/release-signed/app-release.apk --no-osv --expect-signed --expect-version "$EXPECT_VERSION"

      - name: Upload unsigned APK and SHA-256 (dry run)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-dry-run-unsigned
          path: |
            android/build/release-out/*.apk
            android/build/release-out/*.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK and SHA-256 (release)
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release
          path: |
            android/build/release-signed/app-release.apk
            android/build/release-signed/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

  verify-artifact:
    # Runs in both modes, so the artifact hand-over used by "publish" is exercised by every dry run.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')) && 'android-release' || 'android-release-dry-run-unsigned' }}
          path: dist
      - name: Verify SHA-256 of the downloaded artifact
        working-directory: dist
        run: |
          ls -l
          sha256sum -c ./*.sha256

  publish:
    needs: [build, verify-artifact]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: android-release
          path: dist

      - name: Create the GitHub Release with the signed APK and its SHA-256
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          test -f app-release.apk && test -f app-release.apk.sha256
          sha256sum -c app-release.apk.sha256
          sha=$(cut -d' ' -f1 app-release.apk.sha256)
          {
            echo "Signed Android companion app ${TAG#android-v}."
            echo
            echo "SHA-256 of app-release.apk:"
            echo
            echo "    $sha"
            echo
            echo "Verify before installing: \`sha256sum -c app-release.apk.sha256\` (or compare the value above)."
            echo
            echo "Only install this signed APK. The debug APK from CI builds is debuggable and exports test"
            echo "activities: it must never be used with a real device token."
          } > notes.md
          # --latest=false: server releases (vX.Y.Z) stay the repository's "latest release".
          # Created with GITHUB_TOKEN, which by GitHub's rules does not start other workflows, so the release
          # event does not trigger docker-publish.yml (which also skips non-v* tags as a second guard).
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest=false \
            --title "Android app ${TAG#android-v}" --notes-file notes.md \
            app-release.apk app-release.apk.sha256
